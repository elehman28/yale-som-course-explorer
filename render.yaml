# Render blueprint: FastAPI backend (Web Service) + Vite frontend (Static Site).
#
# Deploy the backend FIRST, copy its URL, then set VITE_API_URL on the frontend
# so the browser knows where the API lives.
#
# Secrets (PORTKEY_API_KEY, DATABASE_URL) are marked sync:false — set them in
# the Render dashboard. Never commit them.

services:
  - type: web
    name: som-course-explorer-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: PORTKEY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: som-course-explorer-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the backend service's URL once it is deployed,
      # e.g. https://som-course-explorer-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: send unknown paths to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
